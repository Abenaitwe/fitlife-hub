<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitLife Hub | Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header"><nav class="nav"><a class="brand" href="index.html"><span class="brand-mark">FH</span><span>FitLife Hub</span></a><button class="menu-toggle" type="button" aria-label="Open menu"><span></span><span></span><span></span></button><div class="nav-links"><a href="index.html">Home</a><a href="about.html">About</a><a href="workouts.html">Workouts</a><a href="nutrition.html">Nutrition</a><a href="blog.html">Blog</a><a href="auth.html">Login</a><a href="dashboard.html">Dashboard</a><a class="active" href="contact.html">Contact</a></div></nav></header>
  <main>
    <section class="container page-title">
      <p class="eyebrow">Contact and Feedback</p>
      <h1>Send questions or project feedback.</h1>
      <p class="lead">This form demonstrates validation and user-submitted data display. Recent demo feedback appears below the form.</p>
    </section>
    <section class="section">
      <div class="container grid-2">
        <form class="form-card" id="contactForm">
          <h2>Contact us</h2>
          <div class="form-grid">
            <div class="field"><label for="contactName">Name</label><input id="contactName" name="name" type="text" required></div>
            <div class="field"><label for="contactEmail">Email</label><input id="contactEmail" name="email" type="email" required></div>
            <div class="field full"><label for="message">Message</label><textarea id="message" name="message" required></textarea></div>
          </div>
          <button class="button primary" type="submit">Submit feedback</button>
          <p class="message" id="contactMessage"></p>
        </form>
        <article class="card">
          <h2>Recent feedback</h2>
          <ul class="article-list" id="feedbackList"></ul>
        </article>
      </div>
    </section>
  </main>
  <footer class="footer"><div class="container footer-inner"><span>FitLife Hub</span><a href="index.html">Back home</a></div></footer>
  <script src="script.js"></script>
</body>
</html>
